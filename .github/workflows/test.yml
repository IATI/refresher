name: Test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Setup python
      uses: actions/setup-python@v2
      with:
        python-version: 3.11
        architecture: x64
    - name: Install dependencies
      run: pip install -r requirements-dev.txt
    - name: Test
      run: pytest src/tests/unit

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "unified-pipeline-refresher"
version = "2.9.3"
requires-python = ">= 3.10"
readme = "README.md"
dependencies = [
    # Locking to older versions of azure code as newer versions sometimes return blank files when getting storage blobs
    # (assume there has been an API change)
    "azure-core==1.15.0",
    "azure-storage-blob==12.6.0",
    "azure-storage-queue==12.2.0",
    # Pinned to a release which distrusts the compromised eMudhra G3 intermediates
    # (https://emudhra.we-have-a-problem.com/), as this bundle is our TLS trust store.
    "certifi==2026.10.23",
    "chardet==5.2.0",
    "lxml==6.1.3",
    "prometheus-client==0.20.0",
    "psycopg2==2.9.6",
    "pysolr==3.9.0",
    "python-dateutil==2.8.2",
    "requests==2.31.0",
    "sentry-sdk==2.29.1",
]


[project.optional-dependencies]
dev = [
    "black==24.4.2",
    "flake8==7.0.0",
    "flake8-pyproject==1.2.3",
    "isort==5.13.2",
    "lxml-stubs==0.5.1",
    "mypy==1.10.1",
    "pip-tools==7.4.1",
    "pytest==8.2.2",
    "pytest-mock==3.14.0",
    "pytest-watcher==0.4.3",
    "python-dotenv==1.0.1",
    "types-psycopg2==2.9.21.20240417",
    "types-python-dateutil==2.9.0.20240316",
    "types-requests==2.32.0.20240712",
    "types-urllib3==1.26.25.14",
]


[tool.setuptools]
package-dir = { "" = "src" }
packages = ["constants", "library"]


[tool.isort]
py_version=310
extend_skip = ['__pycache__', '.mypy_cache', '.ve', '.venv']
skip_gitignore = true
src_paths = ['src']
line_length = 119
profile = "black"


[tool.flake8]
max-line-length = 119
extend_ignore = ['E203', 'W503', 'E275']
exclude = ['__pycache__', '.mypy_cache', '.ve', '.venv']
max_complexity = 7


[tool.black]
line-length = 119
include='''src/.*.py$'''


[tool.mypy]
files=["src/"]
mypy_path=["src/"]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["src/tests/unit", "src/tests/integration"]
python_files = ["src/tests/*.py", "src/tests/**/*.py"]
addopts = [
    "--import-mode=importlib"
]
pythonpath = [
  "src"
]
filterwarnings = [
    "ignore::DeprecationWarning:pysolr.*:",
]
